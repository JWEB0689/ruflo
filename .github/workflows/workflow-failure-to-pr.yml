name: Workflow Failure to Auto-PR

# Per-repo trigger: ANY workflow failure on the default branch becomes a PR.
# This expands the old scheduled-only fixer: push, dispatch, schedule and
# merge failures all count. It ignores its own runs and the PR-Agent runs
# to avoid loops, and the engine skips infra failures + duplicates.

on:
  workflow_run:
    workflows:
      - "ADR-166 MCP Bridge Security Lock"
      - "all-plugins-smoke"
      - "business-pods-smoke"
      - "CI/CD Pipeline"
      - "Clone Tracker (14-day rolling)"
      - "CodeQL Advanced"
      - "codex-integration-audit"
      - "cost-tracker-smoke"
      - "CVE Audit Gate"
      - "federation-peer-rust"
      - "funnel-gates"
      - "helpers-manifest-guard"
      - "🔗 Cross-Agent Integration Tests"
      - "metaharness-ci"
      - "metaharness-pin-drift"
      - "neural-trader-smoke"
      - "no-agentbbs-smoke"
      - "no-cli-optdep-bloat-2561"
      - "no-metaharness-smoke"
      - "no-phantom-agentic-flow-subpath"
      - "oia-audit-weekly"
      - "PR-Agent + Sign-off"
      - "🔄 Automated Rollback Manager"
      - "ruflo-agent-smoke"
      - "Stable npm Release"
      - "📊 Status Badges Update"
      - "V3 CI/CD Pipeline"
      - "Validate Marketplace"
      - "🔍 Verification Pipeline"
      - "Dependabot Updates"
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  fix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      !contains(github.event.workflow_run.name, 'Auto-PR') &&
      !contains(github.event.workflow_run.name, 'Auto-Fixer') &&
      !contains(github.event.workflow_run.name, 'PR Agent')
    uses: JWEB0689/pr-agent-settings/.github/workflows/reusable_auto_pr.yml@main
    with:
      mode: failure
      run_id: ${{ github.event.workflow_run.id }}
      workflow_name: ${{ github.event.workflow_run.name }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      run_url: ${{ github.event.workflow_run.html_url }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
